<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <title>LTA BrewBoard</title>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        min-height: 100dvh;
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      #unity-canvas {
        width: 100vw;
        height: 100dvh;
        display: block;
        background: #231F20;
      }

      #fullscreen-hotspot {
        position: fixed;
        z-index: 5;
        left: 2%;
        top: 3%;
        width: 12%;
        height: 12%;
        padding: 0;
        border: 0;
        background: transparent;
        cursor: pointer;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" width="1200" height="675" tabindex="-1"></canvas>
    <button id="fullscreen-hotspot" type="button" aria-label="Toggle full screen"></button>
    <script>
      const canvas = document.querySelector("#unity-canvas");
      const buildUrl = "Build";
      const config = {
        dataUrl: buildUrl + "/Brewboard_Rel_1.0.data.unityweb",
        frameworkUrl: buildUrl + "/Brewboard_Rel_1.0.framework.js.unityweb",
        codeUrl: buildUrl + "/Brewboard_Rel_1.0.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Los Tres Amigos",
        productName: "LTA BrewBoard",
        productVersion: "1.0",
        // Keep Unity's render surface in step with the canvas CSS size.
        // This matters on mobile Safari when its browser controls appear or hide.
        matchWebGLToCanvasSize: true,
      };

      function syncCanvasToViewport() {
        // visualViewport is the portion of the page that is actually visible to
        // the user.  On iOS it changes independently of the layout viewport as
        // Safari's address and tab bars expand or collapse.
        const viewport = window.visualViewport;
        const width = Math.round(viewport ? viewport.width : window.innerWidth);
        const height = Math.round(viewport ? viewport.height : window.innerHeight);

        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
      }

      syncCanvasToViewport();
      window.addEventListener("resize", syncCanvasToViewport);
      window.addEventListener("orientationchange", syncCanvasToViewport);
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", syncCanvasToViewport);
      }

      const script = document.createElement("script");
      script.src = buildUrl + "/Brewboard_Rel_1.0.loader.js";
      script.onload = () => {
        createUnityInstance(canvas, config)
          .then((unityInstance) => {
            let lastFullscreenToggleAt = 0;
            const toggleFullscreen = () => {
              const now = performance.now();
              if (now - lastFullscreenToggleAt < 500) return;
              lastFullscreenToggleAt = now;

              if (document.fullscreenElement || document.webkitFullscreenElement) {
                unityInstance.SetFullscreen(0);
              } else {
                unityInstance.SetFullscreen(1);
              }
            };

            const isInFullscreenHotspot = (event) => {
              const viewport = window.visualViewport;
              const width = viewport ? viewport.width : window.innerWidth;
              const height = viewport ? viewport.height : window.innerHeight;
              return event.clientX >= width * 0.02 && event.clientX <= width * 0.14 &&
                event.clientY >= height * 0.03 && event.clientY <= height * 0.15;
            };

            let lastTap = null;
            // Unity promotes only the canvas into the browser's fullscreen layer.
            // Listen at the document capture phase so the same hotspot remains
            // available when the sibling button is no longer hit-testable.
            document.addEventListener("dblclick", (event) => {
              if (!isInFullscreenHotspot(event)) return;

              event.preventDefault();
              toggleFullscreen();
            }, true);
            document.addEventListener("pointerup", (event) => {
              if (event.pointerType === "mouse" || !isInFullscreenHotspot(event)) return;

              event.preventDefault();
              const now = performance.now();
              const point = { x: event.clientX, y: event.clientY, time: now };
              const isDoubleTap = lastTap && now - lastTap.time < 350 &&
                Math.hypot(point.x - lastTap.x, point.y - lastTap.y) < 32;

              lastTap = isDoubleTap ? null : point;
              if (isDoubleTap) toggleFullscreen();
            }, true);
          })
          .catch((message) => {
            alert(message);
          });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
