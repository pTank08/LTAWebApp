<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | LTA BrewBoard</title>

    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="manifest" href="manifest.webmanifest">

    <!-- Responsive + safe-area -->
    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no,
                   viewport-fit=cover">

    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: black;
        touch-action: none;
      }

      /* Wrapper that rotates on mobile portrait */
      #orientation-wrapper {
        position: fixed;
        top: env(safe-area-inset-top);
        left: env(safe-area-inset-left);
        width: calc(100vw - env(safe-area-inset-left) - env(safe-area-inset-right));
        height: calc(100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
        transform-origin: center center;
        overflow: hidden;
        z-index: 1;
      }

      /* Unity container respects safe areas */
      #unity-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
        box-sizing: border-box;
        z-index: 2;
      }

      /* Responsive canvas */
      #unity-canvas {
        width: 100%;
        height: 100%;
        background: black;
        touch-action: none;
      }

      /* Portrait block overlay */
      #rotate-warning {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: black;
        color: white;
        font-size: 2rem;
        text-align: center;
        padding-top: 40vh;
        z-index: 9999; /* ensure it is always above everything */
      }
    </style>
  </head>

  <body>

    <!-- Forced landscape wrapper -->
    <div id="orientation-wrapper">
      <div id="unity-container">
        <canvas id="unity-canvas" tabindex="-1"></canvas>

        <div id="unity-loading-bar">
          <div id="unity-logo"></div>
          <div id="unity-progress-bar-empty">
            <div id="unity-progress-bar-full"></div>
          </div>
        </div>

        <div id="unity-warning"></div>
      </div>
    </div>

    <!-- Portrait block -->
    <div id="rotate-warning">Please rotate your device to landscape</div>

    <script>
      /* Register service worker for PWA */
      window.addEventListener("load", function () {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("ServiceWorker.js");
        }
      });

      const canvas = document.querySelector("#unity-canvas");
      const loadingBar = document.querySelector("#unity-loading-bar");
      const progressBarFull = document.querySelector("#unity-progress-bar-full");
      const warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      /* --- Forced landscape logic --- */

      function isMobile() {
        return /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      }

      function updateOrientation() {
        const wrapper = document.getElementById("orientation-wrapper");
        const warning = document.getElementById("rotate-warning");

        const portrait = window.innerHeight > window.innerWidth;

        if (isMobile() && portrait) {
          warning.style.display = "block";

          wrapper.style.transform = "rotate(90deg)";
          wrapper.style.width = window.innerHeight + "px";
          wrapper.style.height = window.innerWidth + "px";
          wrapper.style.left = (window.innerWidth - window.innerHeight)/2 + "px";
          wrapper.style.top = (window.innerHeight - window.innerWidth)/2 + "px";
        } else {
          warning.style.display = "none";

          wrapper.style.transform = "rotate(0deg)";
          wrapper.style.width = "calc(100vw - env(safe-area-inset-left) - env(safe-area-inset-right))";
          wrapper.style.height = "calc(100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom))";
          wrapper.style.left = "env(safe-area-inset-left)";
          wrapper.style.top = "env(safe-area-inset-top)";
        }
      }

      window.addEventListener("resize", updateOrientation);
      window.addEventListener("orientationchange", updateOrientation);
      updateOrientation();

      /* --- Unity loader --- */

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/BrewboardWeb_Rel_0.2.1_PWA.loader.js";

      var config = {
        arguments: [],
        dataUrl: buildUrl + "/BrewboardWeb_Rel_0.2.1_PWA.data.unityweb",
        frameworkUrl: buildUrl + "/BrewboardWeb_Rel_0.2.1_PWA.framework.js.unityweb",
        codeUrl: buildUrl + "/BrewboardWeb_Rel_0.2.1_PWA.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Los Tres Amigos",
        productName: "LTA BrewBoard",
        productVersion: "0.2.1",
        showBanner: unityShowBanner
      };

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = (100 * progress) + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
