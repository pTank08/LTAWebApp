<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <title>LTA BrewBoard</title>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        min-height: 100dvh;
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      #unity-canvas {
        width: 100vw;
        height: 100dvh;
        display: block;
        background: #231F20;
      }

      #orientation-lock {
        display: none;
        position: fixed;
        z-index: 10;
        inset: 0;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        padding: 32px;
        background: #141f28;
        color: #fff;
        font-family: Arial, sans-serif;
        text-align: center;
      }

      #orientation-lock h1 {
        margin: 0 0 16px;
        color: #faf0be;
        font-size: 32px;
      }

      #orientation-lock p {
        margin: 0;
        font-size: 20px;
      }

      #fullscreen-button {
        display: block;
        position: fixed;
        z-index: 5;
        top: 16px;
        right: 16px;
        padding: 10px 14px;
        border: 1px solid #00d9ff;
        border-radius: 6px;
        background: #141f28;
        color: #fff;
        font-size: 16px;
        cursor: pointer;
      }

      #fullscreen-button.fullscreen-unavailable {
        display: none;
      }

      @media (orientation: portrait) {
        #orientation-lock {
          display: flex;
        }

        #unity-canvas {
          pointer-events: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" width="1200" height="675" tabindex="-1"></canvas>
    <button id="fullscreen-button" type="button">Full Screen</button>
    <div id="orientation-lock" role="alert">
      <div>
        <h1>Rotate Your Device</h1>
        <p>BrewBoard works in landscape.</p>
      </div>
    </div>
    <script>
      const canvas = document.querySelector("#unity-canvas");
      const fullscreenButton = document.querySelector("#fullscreen-button");
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      const buildUrl = "Build";
      const config = {
        dataUrl: buildUrl + "/BrewboardWeb_Dev_0.3.4.data.unityweb",
        frameworkUrl: buildUrl + "/BrewboardWeb_Dev_0.3.4.framework.js.unityweb",
        codeUrl: buildUrl + "/BrewboardWeb_Dev_0.3.4.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Los Tres Amigos",
        productName: "LTA BrewBoard",
        productVersion: "0.3.4",
        // Keep Unity's render surface in step with the canvas CSS size.
        // This matters on mobile Safari when its browser controls appear or hide.
        matchWebGLToCanvasSize: true,
      };

      function syncCanvasToViewport() {
        // visualViewport is the portion of the page that is actually visible to
        // the user.  On iOS it changes independently of the layout viewport as
        // Safari's address and tab bars expand or collapse.
        const viewport = window.visualViewport;
        const width = Math.round(viewport ? viewport.width : window.innerWidth);
        const height = Math.round(viewport ? viewport.height : window.innerHeight);

        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
      }

      syncCanvasToViewport();
      window.addEventListener("resize", syncCanvasToViewport);
      window.addEventListener("orientationchange", syncCanvasToViewport);
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", syncCanvasToViewport);
      }

      if (isIOS) {
        fullscreenButton.classList.add("fullscreen-unavailable");
      }

      const script = document.createElement("script");
      script.src = buildUrl + "/BrewboardWeb_Dev_0.3.4.loader.js";
      script.onload = () => {
        createUnityInstance(canvas, config)
          .then((unityInstance) => {
            fullscreenButton.addEventListener("click", () => unityInstance.SetFullscreen(1));
          })
          .catch((message) => {
            alert(message);
          });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
