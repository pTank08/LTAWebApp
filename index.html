<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <title>LTA BrewBoard</title>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      #unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
        background: #231F20;
      }

      #orientation-lock {
        display: none;
        position: fixed;
        z-index: 10;
        inset: 0;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        padding: 32px;
        background: #141f28;
        color: #fff;
        font-family: Arial, sans-serif;
        text-align: center;
      }

      #orientation-lock h1 {
        margin: 0 0 16px;
        color: #faf0be;
        font-size: 32px;
      }

      #orientation-lock p {
        margin: 0;
        font-size: 20px;
      }

      @media (orientation: portrait) {
        #orientation-lock {
          display: flex;
        }

        #unity-canvas {
          pointer-events: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" width="1200" height="675" tabindex="-1"></canvas>
    <div id="orientation-lock" role="alert">
      <div>
        <h1>Rotate Your Device</h1>
        <p>BrewBoard works in landscape.</p>
      </div>
    </div>
    <script>
      const canvas = document.querySelector("#unity-canvas");
      const buildUrl = "Build";
      const config = {
        dataUrl: buildUrl + "/BrewboardWeb_Dev_0.3.0.data.unityweb",
        frameworkUrl: buildUrl + "/BrewboardWeb_Dev_0.3.0.framework.js.unityweb",
        codeUrl: buildUrl + "/BrewboardWeb_Dev_0.3.0.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Los Tres Amigos",
        productName: "LTA BrewBoard",
        productVersion: "0.3.0",
      };

      const script = document.createElement("script");
      script.src = buildUrl + "/BrewboardWeb_Dev_0.3.0.loader.js";
      script.onload = () => {
        createUnityInstance(canvas, config).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
